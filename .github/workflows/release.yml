name: Release StreamFlow APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.277-lab
          name: "StreamFlow v1.7.277-lab"
          body: |
            ## Actualización automática de StreamFlow (v1.7.277-lab)

            ### Archivos disponibles para instalación:
            - **Universal (Móvil y TV):** `streamflow-1.7.277-lab-universal.apk` (Recomendado)
            - **Móvil:** `streamflow-1.7.277-lab-mobile.apk`
            - **Android TV / Fire TV:** `streamflow-1.7.277-lab-tv.apk`

            *Actualizable directamente desde la aplicación mediante el actualizador integrado.*
          draft: false
          prerelease: false
          make_latest: true
          files: apks/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
