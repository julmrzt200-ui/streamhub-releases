name: Release StreamFlow APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.285-lab
          name: "StreamFlow v1.7.285-lab"
          body: |
            ## Actualización automática de StreamFlow (v1.7.285-lab)

            ### Novedades y correcciones:
            - **Instalador nativo:** Solucionado el bucle de actualización en Fire TV / Android TV que impedía instalar la versión nueva.
            - **Navegación Xuper:** Al desplazarse por los canales NO se reproducen solos; únicamente se reproducen al pulsar OK. Pulsar OK en el canal que ya está reproduciendo expande a pantalla completa.
            - **Botón Favorito accesible:** Botón de favorito en la vista previa del reproductor con estrella dorada, y atajo directo con tecla Menú del mando a distancia sobre cualquier canal.
            - **Navegación fluida D-pad:** Movimiento completo entre lista de canales, botón de pantalla completa, botón de favorito y los botones rápidos inferiores (Todos, Favoritos, Buscar).
            - **Catálogo completo Magis TV:** Todos los 1.088 canales disponibles sin límite de paginación.

            ### Archivos disponibles para instalación:
            - **Universal (Móvil y TV):** `streamflow-1.7.285-lab-universal.apk` (Recomendado)
            - **Android TV / Fire TV:** `streamflow-1.7.285-lab-tv.apk`
            - **Móvil:** `streamflow-1.7.285-lab-mobile.apk`
            - **StreamHub TV:** `streamhub-1.7.285-lab-tv.apk`
            - **StreamHub Universal:** `streamhub-1.7.285-lab-universal.apk`
            - **StreamHub Móvil:** `streamhub-1.7.285-lab-mobile.apk`

            *Actualizable directamente desde la aplicación mediante el actualizador integrado.*
          draft: false
          prerelease: false
          make_latest: true
          files: apks/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
